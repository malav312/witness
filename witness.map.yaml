      - The list starts empty. Per-task controls (complete, delete) only show up once a task exists, and their names aren't in the crawl, so find them after adding a task.
      - Try adding an empty or whitespace-only task; the crawl doesn't show what should happen.
      - Reload to check whether tasks persist; the crawl gives no evidence either way.
  - name: Complete and delete tasks
    page: /
    how_to_reach:
      - Add at least one task
      - Use the per-task controls that appear on each item in list "Task list"
