  - name: Complete and delete tasks
    page: /
    how_to_reach:
      - Add at least one task
      - Use the per-task controls that then appear in list "Task list"
    controls: []
    behavior: Completing a task should lower the "items left" count. Deleting removes the task from the list.
    traps:
