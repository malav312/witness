      - list "Task list"
    behavior: Completing a task should lower the "items left" count. Deleting removes the task from the list.
    traps:
      - Whether deleting asks for confirmation depends on the checkbox "Ask for confirmation before deleting a task" on /settings, which is off by default. With it on, expect a confirmation dialog.
      - Per-task control names aren't in the crawl, so don't assume them.
