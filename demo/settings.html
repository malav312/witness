<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings · Tasks</title>
    <style>
      body { font: 16px system-ui, sans-serif; max-width: 480px; margin: 48px auto; color: #222; }
      nav { font-size: 14px; text-align: right; }
      h1 { font-size: 28px; }
      label { display: flex; gap: 8px; align-items: center; padding: 8px 0; }
      #saved { color: #1a7f37; font-size: 14px; min-height: 20px; }
    </style>
  </head>
  <body>
    <nav><a href="/">Back to tasks</a></nav>
    <h1>Settings</h1>
    <label><input type="checkbox" id="confirmDelete" /> Ask for confirmation before deleting a task</label>
    <label><input type="checkbox" id="showCount" /> Show the "items left" counter</label>
    <p id="saved" role="status"></p>
    <script>
      const KEY = "witness-demo-settings";
      const settings = { confirmDelete: false, showCount: true, ...JSON.parse(localStorage.getItem(KEY) ?? "{}") };
      for (const id of ["confirmDelete", "showCount"]) {
        const box = document.getElementById(id);
        box.checked = settings[id];
        box.onchange = () => {
          settings[id] = box.checked;
          localStorage.setItem(KEY, JSON.stringify(settings));
          document.getElementById("saved").textContent = "Saved";
        };
      }
    </script>
  </body>
</html>
